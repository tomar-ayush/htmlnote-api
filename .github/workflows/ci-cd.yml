name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t htmlnote-api:ci .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - id: check
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$GCP_WIF_PROVIDER" ] && [ -n "$GCP_SA_EMAIL" ]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
          elif [ -n "$GCP_PROJECT_ID" ] && [ -n "$GCP_SA_KEY" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloud Run deploy until GCP credentials are configured."
          fi

      - if: steps.check.outputs.mode != 'skip'
        uses: actions/checkout@v4

      - if: steps.check.outputs.mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - if: steps.check.outputs.mode == 'key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: steps.check.outputs.mode != 'skip'
        uses: google-github-actions/setup-gcloud@v3

      - id: image
        if: steps.check.outputs.mode != 'skip'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          REPO: ${{ vars.GCP_ARTIFACT_REPO || 'htmlnote' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'htmlnote-api' }}
        run: |
          gcloud artifacts repositories describe "$REPO" --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$REPO" --repository-format=docker --location="$REGION" --project="$PROJECT_ID"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - id: deploy
        if: steps.check.outputs.mode != 'skip'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE || 'htmlnote-api' }}
          project_id: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          image: ${{ steps.image.outputs.uri }}
          flags: --allow-unauthenticated --min-instances=0 --max-instances=3 --cpu=1 --memory=512Mi
          env_vars_update_strategy: merge
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || vars.ALLOWED_ORIGINS }}
            COOKIE_SECURE=true

      - if: steps.check.outputs.mode != 'skip'
        run: |
          echo "Deployed Cloud Run service URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
